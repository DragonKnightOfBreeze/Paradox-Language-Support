<html>
<body>
  报告文件编码不正确的脚本文件。
  <p>
    具体来说，应为 <b>UTF-8 NO BOM</b>。
  </p>
  <p>特别是：</p>
  <ul>
    <li>对于 Stellaris，4.6 之前版本位于 <code>common/name_lists</code> 目录下的脚本文件的编码应为 <b>UTF-8 BOM</b>，4.6 起以及其他脚本文件的编码应为 <b>UTF-8 NO BOM</b>。</li>
    <li>对于其他游戏类型，是否使用 BOM 取决于游戏类型和文件路径；此检查目前不校验这些情况。</li>
  </ul>
  <p>说明：</p>
  <ul>
    <li>忽略注入的文件和临时文件。</li>
    <li>忽略空文件。</li>
  </ul>
</body>
</html>
