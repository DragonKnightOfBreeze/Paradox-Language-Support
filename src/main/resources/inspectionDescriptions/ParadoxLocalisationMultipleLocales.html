<html>
<body>
  Reports localisation files which contain multiple locale declarations.
  <p>
    For a localisation file, it's name should contain a locale id,
    and it's containing locale declaration should be only the matched one.
  </p>
  <p>
    For example, the locale declaration <code>l_english</code> in the file <code>events_l_english.yml</code>.
  </p>
</body>
</html>
