settings.inference=Inference
settings.inference.injectionForParameterValue=Enable automatic language injection for parameter values (as script fragments)
settings.inference.injectionForParameterValue.tip=If enabled, the plugin will automatically apply language injection to parameter values and default values in script files. The affected text will be recognized as script fragments, providing all regular language features.
settings.inference.injectionForLocalisationText=Enable automatic language injection for string literals (as localisation text)
settings.inference.injectionForLocalisationText.tip=If enabled, the plugin will apply language injection to string literals in script files when necessary. The affected text will be recognized as localisation text, providing all regular language features.
settings.inference.configContextForParameters=Infer config context for parameters
settings.inference.configContextForParameters.tip=If enabled, the plugin will infer the config context in parameter values and default values based on parameter usages and extended configs (prioritized).
settings.inference.configContextForInlineScripts=Infer config context for inline scripts
settings.inference.configContextForInlineScripts.tip=If enabled, the plugin will infer the config context in inline script files, based on inline script usages and extended configs (prioritized).
settings.inference.scopeContext=Infer scope context for scripted triggers, effects, etc.
settings.inference.scopeContext.tip=If enabled, the plugin will infer the scope context for scripted triggers, scripted effects, etc., based on their usages. Note: This may introduce additional performance overhead.
settings.inference.scopeContextForEvents=Infer scope context for events
settings.inference.scopeContextForEvents.tip=If enabled, the plugin will infer the scope context for events, based on their usages. Note: This may introduce additional performance overhead.
settings.inference.scopeContextForOnActions=Infer scope context for on actions
settings.inference.scopeContextForOnActions.tip=If enabled, the plugin will infer the scope context for on actions, based on their usages. Note: This may introduce additional performance overhead.
settings.inference.fast=Use fast inference
settings.inference.fast.tip=Whether to use the first available inference result, instead of merging from all inference sources.
settings.inference.fromUsages=Based on usages
settings.inference.fromUsages.tip=Whether to infer based on usages.
settings.inference.fromConfig=Based on extended configs
settings.inference.fromConfig.tip=Whether to infer based on extended configs.

