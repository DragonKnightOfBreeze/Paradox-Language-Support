settings.config.features=Features Specific
settings.config.features.checkComparisonOperators=Check comparison operators for definition properties
settings.config.features.checkComparisonOperators.tip=If enabled, script properties are allowed to use comparison operators (such as <code>>=</code>) as delimiters only if the matching property config explicitly uses <code>==</code> as the separator. <strong>NOTE:</strong> Depending on how complete the configs are, this may cause additional false positives.

settings.extensions.markdown=Markdown
settings.extensions.markdown.resolveLinks=Resolve links
settings.extensions.markdown.resolveLinks.tip=If enabled, the plugin will try to resolve Markdown links with specially formatted link text to target references (e.g., definitions and localizations).
settings.extensions.markdown.resolveInlineCodes=Resolve inline codes
settings.extensions.markdown.resolveInlineCodes.tip=If enabled, the plugin will try to resolve Markdown inline codes to target references (e.g., definitions and localizations).
settings.extensions.markdown.injectCodeBlocks=Inject code blocks with additional information
settings.extensions.markdown.injectCodeBlocks.tip=If enabled, by declaring specially formatted attributes after the language ID of Markdown code blocks, you can specify additional information for fragments of script, localization and csv files, such as game type and file path.

